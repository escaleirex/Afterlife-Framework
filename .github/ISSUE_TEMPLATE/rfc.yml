name: RFC tracking
description: Track an RFC through review and implementation
title: "[RFC]: "
labels: ["type:rfc", "needs-triage"]
body:
  - type: input
    id: rfc
    attributes:
      label: RFC path
      description: e.g. rfcs/0002-event-bus.md
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Related docs
      description: Paths under docs/
  - type: dropdown
    id: status
    attributes:
      label: RFC status
      options: [Draft, Review, Accepted, Implemented, Rejected, Deferred, Superseded]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Discussion notes
